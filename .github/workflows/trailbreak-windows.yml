# TRAILBREAK for Windows: builds the installable game (TRAILBREAK/desktop: Electron and an NSIS installer) on a Windows
# runner and publishes TRAILBREAK-Setup-<version>.exe as a release of this repository (the newest one is "Latest"), with
# latest.yml and the installer's blockmap, which the installed games read to update themselves (electron-updater).
# Each build is a new version: package.json's major.minor and this workflow's run number (0.1.7 for run 7).
# Before publishing, the new installer is tried as a player would: installed silently, the game started and driven
# (TRAILBREAK/desktop/test/smoke.cjs), then uninstalled. A build that fails that is never published, so the installed
# games never update to it.
# Runs when the game or its desktop app changes on the development branch (or by hand, once this file is on the
# repository's default branch: Actions > Run workflow).
name: TRAILBREAK for Windows

on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-volta-hxo6tl]
    paths:
      - 'TRAILBREAK/desktop/**'
      - 'TRAILBREAK/src/**'
      - 'TRAILBREAK/public/**'
      - 'TRAILBREAK/server/**'
      - 'TRAILBREAK/server.js'
      - 'TRAILBREAK/config.json'
      - '.github/workflows/trailbreak-windows.yml'

permissions:
  contents: write

concurrency:
  group: trailbreak-windows
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: TRAILBREAK
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The game's tests
        run: npm test

  installer:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: TRAILBREAK/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TRAILBREAK/desktop/package-lock.json

      - name: Install the build tools
        run: npm ci

      - name: Version
        id: v
        run: |
          v="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}"
          npm pkg set version="$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Install it, as a player would
        id: install
        shell: pwsh
        run: |
          $setup = (Get-Item "dist/TRAILBREAK-Setup-${{ steps.v.outputs.version }}.exe").FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter TRAILBREAK.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'TRAILBREAK.exe was not installed under %LOCALAPPDATA%\Programs' }
          Write-Host "installed: $($exe.FullName)"
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'resources\game\server.js'))) { throw 'the game files were not installed' }
          $start = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\TRAILBREAK.lnk"
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'TRAILBREAK.lnk'
          if (-not (Test-Path $start)) { throw "no Start-menu shortcut ($start)" }
          if (-not (Test-Path $desk)) { throw "no desktop shortcut ($desk)" }
          "exe=$($exe.FullName -replace '\\', '/')" >> $env:GITHUB_OUTPUT

      - name: Play it (the installed game, started and driven)
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.0
          node test/smoke.cjs "${{ steps.install.outputs.exe }}" smoke

      - name: Uninstall it
        shell: pwsh
        run: |
          $dir = Split-Path "${{ steps.install.outputs.exe }}"
          Start-Process -FilePath (Join-Path $dir 'Uninstall TRAILBREAK.exe') -ArgumentList '/S' -Wait
          # (the uninstaller copies itself away and finishes on its own)
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'TRAILBREAK.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir 'TRAILBREAK.exe')) { throw "still installed in $dir" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\TRAILBREAK.lnk") { throw 'the Start-menu shortcut was left behind' }
          Write-Host 'uninstalled'

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-test-screens-${{ steps.v.outputs.version }}
          path: TRAILBREAK/desktop/smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v5
        with:
          name: TRAILBREAK-Setup-${{ steps.v.outputs.version }}
          path: |
            TRAILBREAK/desktop/dist/TRAILBREAK-Setup-*.exe
            TRAILBREAK/desktop/dist/TRAILBREAK-Setup-*.exe.blockmap
            TRAILBREAK/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trailbreak-windows-${{ steps.v.outputs.version }}
          name: TRAILBREAK for Windows ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            The installable TRAILBREAK for Windows 10 and 11 (64-bit). Download **TRAILBREAK-Setup-${{ steps.v.outputs.version }}.exe** below and run it.

            Windows SmartScreen may say it doesn't recognise the app (it isn't code-signed): choose **More info**, then **Run anyway**. The installer asks where to install (your user folder by default, no administrator needed) and adds Start-menu and desktop shortcuts. Uninstall from Settings > Apps.

            Installed, the game keeps itself up to date: it downloads a newer release in the background and installs it when you close the game. (latest.yml and the .blockmap are for that: you don't need them.)

            Built from ${{ github.sha }}.
          files: |
            TRAILBREAK/desktop/dist/TRAILBREAK-Setup-*.exe
            TRAILBREAK/desktop/dist/TRAILBREAK-Setup-*.exe.blockmap
            TRAILBREAK/desktop/dist/latest.yml
          fail_on_unmatched_files: true
