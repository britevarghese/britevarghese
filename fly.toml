# Fly.io: `fly launch --copy-config --no-deploy && fly deploy`
app = "strikepoint"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  BOTS = "6"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # keep rooms alive; games are stateful
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpus = 1
