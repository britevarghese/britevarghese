# Render Blueprint for NIGHTSHIFT and TRAILBREAK (https://render.com/docs/blueprint-spec)
# Render dashboard -> New -> Blueprint -> pick this repository. The game server has no npm
# dependencies, so there is nothing to build; Render provides PORT and the server binds 0.0.0.0.
services:
  - type: web
    name: nightshift
    runtime: node
    plan: free
    rootDir: NIGHTSHIFT
    branch: claude/sharp-edison-fm66kb
    buildCommand: node --version
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
  # TRAILBREAK: co-op off-road game (TRAILBREAK/). Same zero-dependency setup.
  - type: web
    name: trailbreak
    runtime: node
    plan: free
    rootDir: TRAILBREAK
    branch: claude/sweet-volta-hxo6tl
    buildCommand: node --version
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
